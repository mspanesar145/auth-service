server:
  port: 8081
spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: postgres
    password: password
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: false
  kafka:
    bootstrap-servers: localhost:9092
    spring:
    consumer:
      group-id: cenes-user-service
      auto-offset-reset: earliest
      enable-auto-commit: false

      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

    listener:
      ack-mode: record
      auto-startup: false

app:
  kafka:
    topics:
      user-registered: cenes.auth.user-registered.v1
security:
  jwt:
    issuer: ${JWT_ISSUER:http://localhost:8081}
    access-token-seconds: ${JWT_ACCESS_SECONDS:900}
    private-key:
    public-key:
auth:
  otp:
    expiry-seconds: 300
    max-attempts: 5
    resend-cooldown-seconds: 60
  refresh-token-days: 30
management:
  endpoints:
    web:
      exposure:
        include: health,info
sms:
  gateway-url: ${SMS_GATEWAY_URL:}
  api-key: ${SMS_API_KEY:}
testMode: true