server:
  port: 8081
spring:
  application:
    name: auth-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/auth_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:password}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
security:
  jwt:
    issuer: ${JWT_ISSUER:http://localhost:8081}
    access-token-seconds: ${JWT_ACCESS_SECONDS:900}
    private-key:
    public-key:
auth:
  otp:
    expiry-seconds: 300
    max-attempts: 5
    resend-cooldown-seconds: 60
  refresh-token-days: 30
management:
  endpoints:
    web:
      exposure:
        include: health,info
sms:
  gateway-url: ${SMS_GATEWAY_URL:}
  api-key: ${SMS_API_KEY:}
testMode: true